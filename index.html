
<!DOCTYPE html>

  <style>
    /* ===== 頂端固定導覽列 ===== */
.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background-color: #FFFCF6;
  border: 3px solid #3E3A39;
  border-radius: 22px;
  padding: 12px 18px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-links a {
  text-decoration: none;
  color: #3E3A39;
  font-size: 16px;
  padding: 9px 13px;
  border-radius: 18px;
  transition: background-color 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
  background-color: #F2A497;
}

@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    padding: 10px;
  }

  .nav-links {
    width: 100%;
    justify-content: space-around;
    gap: 2px;
  }

  .nav-links a {
    font-size: 13px;
    padding: 8px 7px;
  }

  .logo {
    font-size: 20px;
  }
}
    /* 網站基本設定 */
    :root {
      --paper: #FFFCF6;
      --ink: #3E3A39;
      --coral: #F2A497;
      --yellow: #F6D27A;
      --blue: #A8D3E6;
      --green: #B9DAA5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Huninn', sans-serif;
    }

    /* 網站主要內容 */
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 首頁標題 */
    .hero {
      text-align: center;
      padding: 60px 20px;
      border: 3px solid var(--ink);
      border-radius: 30px;
      background-color: #FFF8E9;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 54px);
      margin: 10px 0;
    }

    .hero p {
      font-size: 18px;
    }

    .hero .date {
      display: inline-block;
      background-color: var(--yellow);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 18px;
    }
    
/* ===== 首頁繪本主視覺 ===== */
.hero {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 35px 18px 30px;
  border: 3px solid var(--ink);
  border-radius: 30px;
  background-color: #FFF5E9;
}

.hero h1 {
  position: relative;
  z-index: 2;
  font-size: clamp(34px, 7vw, 58px);
  margin: 12px 0;
  color: var(--ink);
}

.hero p {
  position: relative;
  z-index: 2;
  font-size: 19px;
  margin: 8px 0 18px;
}

.hero .date {
  position: relative;
  z-index: 2;
  display: inline-block;
  background-color: var(--yellow);
  border: 2px solid var(--ink);
  padding: 10px 24px;
  border-radius: 30px;
  font-size: 17px;
}

.hero-illustration {
  width: 100%;
  max-width: 700px;
  height: auto;
  display: block;
  margin: 0 auto;
}

.hero-illustration .cloud {
  animation: float 4s ease-in-out infinite;
}

.hero-illustration .deer {
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .hero-illustration .cloud,
  .hero-illustration .deer {
    animation: none;
  }
}

/* ===== 出發倒數計時 ===== */
.countdown {
  margin: 25px auto 5px;
  padding: 18px;
  max-width: 420px;
  background-color: #FFFFFF;
  border: 3px solid var(--ink);
  border-radius: 25px;
  text-align: center;
}

.countdown-title {
  font-size: 18px;
  margin-bottom: 5px;
}

.countdown-number {
  color: #F2A497;
  font-size: 55px;
  font-weight: bold;
  line-height: 1.3;
}

.countdown-number span {
  font-size: 20px;
  color: var(--ink);
}

.countdown-date {
  font-size: 15px;
  margin-top: 5px;
}

/* ===== 航班資訊卡片 ===== */

.section-title {
  display: inline-block;
  background-color: var(--yellow);
  border: 3px solid var(--ink);
  border-radius: 25px;
  padding: 9px 22px;
  font-size: 22px;
  margin-bottom: 18px;
}

.flight-section {
  margin-top: 30px;
  padding: 22px;
  border: 3px solid var(--ink);
  border-radius: 28px;
  background-color: #FFFFFF;
}

.flight-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.flight-card {
  border: 2px solid var(--ink);
  border-radius: 22px;
  padding: 18px;
}

.flight-card.outbound {
  background-color: #FFF3D5;
}

.flight-card.return {
  background-color: #FCE9E5;
}

.flight-label {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
}

.flight-route {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.flight-time {
  font-size: 30px;
  font-weight: bold;
}

.flight-airport {
  font-size: 13px;
  margin-top: 5px;
}

.flight-plane {
  font-size: 28px;
}

@media (max-width: 600px) {
  .flight-grid {
    grid-template-columns: 1fr;
  }

  .flight-time {
    font-size: 25px;
  }

  .flight-section {
    padding: 14px;
  }
}

  </style>

<script>
// ===== 大阪旅行出發倒數 =====
function updateCountdown() {
  // 設定出發日期：2027年1月7日
  const targetDate = new Date(2027, 0, 7);

  // 取得今天日期
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // 計算相差天數
  const difference = targetDate - today;
  const days = Math.ceil(difference / (1000 * 60 * 60 * 24));

  // 顯示倒數
  const display = document.getElementById("daysLeft");

  if (days > 0) {
    display.textContent = days;
  } else if (days === 0) {
    display.textContent = "今天出發！";
  } else {
    display.textContent = "旅程開始！";
  }
}

updateCountdown();
</script>
