
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>來企大阪玩｜六天五夜自由行</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">

  <style>
    /* 網站基本設定 */
    :root {
      --paper: #FFFCF6;
      --ink: #3E3A39;
      --coral: #F2A497;
      --yellow: #F6D27A;
      --blue: #A8D3E6;
      --green: #B9DAA5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Huninn', sans-serif;
    }

    /* 網站主要內容 */
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 首頁標題 */
    .hero {
      text-align: center;
      padding: 60px 20px;
      border: 3px solid var(--ink);
      border-radius: 30px;
      background-color: #FFF8E9;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 54px);
      margin: 10px 0;
    }

    .hero p {
      font-size: 18px;
    }

    .hero .date {
      display: inline-block;
      background-color: var(--yellow);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">
      <h1>✈️ 來企大阪玩！</h1>
      <p>大阪・京都・奈良 六天五夜</p>
      <div class="date">2027.01.07 — 2027.01.12</div>
    </section>

  </main>

</body>
</html>
